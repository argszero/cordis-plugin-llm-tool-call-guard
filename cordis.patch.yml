# The @argszero/cordis-plugin-llm-tool-call-guard bundle patch: no deployment-
# specific config is needed to mount (maxArgsBytes=24576, fail=true by default).
# Tune via a profile layer if desired:
#
#   - set:
#       - id: llm-tool-call-guard
#         config:
#           maxArgsBytes: 8192        # per-call byte budget
#           maxArgsFragments: 1024    # per-call fragment budget (default 0=off)
#           maxTotalArgsBytes: 32768  # whole-request aggregate budget (default 0=off)
#           fail: true
#
# The guard cuts a single tool call whose streamed arguments exceed the per-call
# byte budget (maxArgsBytes), or that emits too many tool-call-delta fragments
# (maxArgsFragments — the #6059 fragment-count runaway), or when the cumulative
# arguments across all calls exceed maxTotalArgsBytes. Every other chunk passes
# through byte-for-byte.

- insert:
    - id: llm-tool-call-guard
      name: '@argszero/cordis-plugin-llm-tool-call-guard'
