# The @argszero/cordis-plugin-llm-tool-call-guard bundle patch: no deployment-
# specific config is needed to mount (maxArgsBytes=24576, fail=true by default).
# Tune via a profile layer if desired:
#
#   - set:
#       - id: llm-tool-call-guard
#         config:
#           maxArgsBytes: 8192        # per-call byte budget
#           maxArgsFragments: 1024    # per-call fragment budget (default 0=off)
#           maxTotalArgsBytes: 32768  # whole-request aggregate budget (default 0=off)
#           fail: true
#
# The guard cuts a single tool call whose streamed arguments exceed the per-call
# byte budget (maxArgsBytes), or that emits too many tool-call-delta fragments
# (maxArgsFragments — the #6059 fragment-count runaway), or when the cumulative
# arguments across all calls exceed maxTotalArgsBytes. Every other chunk passes
# through byte-for-byte.

#
# Identity guard (v0.1.4, discussion #6152). A model can emit a tool call with
# an empty id/name (`{"id":"","name":""}`); the harness persists it and the next
# load rejects the stored result, marking the whole session corrupt. This seam
# can prevent that. Defaults are repair:'repair', repairBytes:true.
#
#   - set:
#       - id: llm-tool-call-guard
#         config:
#           repair: repair        # repair | error | off   (off = v0.1.3 behaviour)
#           repairBytes: true     # also substitute {} for blank arguments
#
# repair:'repair' substitutes a deterministic synthetic call id (on both the
# deltas and the authoritative block-end) so the call stays loadable; an empty
# NAME is left alone because the harness already turns it into an honest
# UNKNOWN_TOOL result. repair:'error' cuts the stream with an error finish so
# the degenerate call is never executed. Every repaired block is reported once
# at warn level, since "nothing was visible" is the heart of #6152.

- insert:
    - id: llm-tool-call-guard
      name: '@argszero/cordis-plugin-llm-tool-call-guard'
